name: Motion controls step 1
on:
  push:
    branches: [feat/experience-studio]
    paths: ['.github/workflows/motion-step1-quality.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare tracked source and locked dependencies only
        run: |
          mkdir -p /tmp/dth-motion-review
          git archive HEAD DTH-3D-Commerce .github/workflows | tar -x -C /tmp/dth-motion-review
          git rev-parse HEAD > /tmp/dth-motion-review/SOURCE_COMMIT
          cd /tmp/dth-motion-review/DTH-3D-Commerce
          npm ci
          tar -czf /tmp/dth-motion-workspace.tar.gz -C /tmp/dth-motion-review .
      - uses: actions/upload-artifact@v4
        with:
          name: motion-control-workspace
          path: /tmp/dth-motion-workspace.tar.gz
          retention-days: 1
