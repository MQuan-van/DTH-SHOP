name: Admin Support quality
on:
  push:
    branches: [feat/admin-support-studio]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve image-decoder dependency in isolated workspace
        working-directory: DTH-3D-Commerce
        run: |
          npm ci
          npm install --workspace backend --save-exact sharp
          node -p 'require("sharp/package.json").version'
          npm audit --json > /tmp/admin-dependency-audit.json || true
          tar -czf /tmp/admin-image-dependency.tar.gz backend/package.json package-lock.json node_modules/sharp node_modules/@img node_modules/detect-libc node_modules/semver
      - uses: actions/upload-artifact@v4
        with:
          name: admin-image-dependency
          path: |
            /tmp/admin-image-dependency.tar.gz
            /tmp/admin-dependency-audit.json
          retention-days: 1
