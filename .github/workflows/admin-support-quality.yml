name: Admin Support quality
on:
  push:
    branches: [feat/admin-support-studio]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/admin-support-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin the reviewed decoder and commit only its manifests on the feature branch
        working-directory: DTH-3D-Commerce
        run: |
          npm ci
          npm install --workspace backend --save-exact sharp@0.35.4
          git add backend/package.json package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: lock sharp 0.35.4 for bounded support image decoding'
            git push origin HEAD:feat/admin-support-studio
          fi
      - name: Review source, unit tests and build
        working-directory: DTH-3D-Commerce
        run: |
          npm run check
          npm test
          npm run test:account
          npm run test:admin
          VITE_STORE_MODE=api npm run build
      - name: Archive isolated review workspace
        if: always()
        run: |
          mkdir -p /tmp/admin-review-source
          git archive HEAD DTH-3D-Commerce .github/workflows | tar -x -C /tmp/admin-review-source
          cp -a DTH-3D-Commerce/node_modules /tmp/admin-review-source/DTH-3D-Commerce/
          tar -czf /tmp/admin-source.tar.gz -C /tmp/admin-review-source .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-source
          path: /tmp/admin-source.tar.gz
          retention-days: 1
