name: Shop fitment quality
on:
  pull_request:
    paths:
      - 'DTH-3D-Commerce/frontend/src/shop/**'
      - 'DTH-3D-Commerce/shared/domain.mjs'
      - 'DTH-3D-Commerce/shared/catalog.json'
      - 'DTH-3D-Commerce/tests/shop-*.test.mjs'
      - 'DTH-3D-Commerce/tests/browser/shop_fitment.py'
      - 'DTH-3D-Commerce/package*.json'
      - 'DTH-3D-Commerce/frontend/package.json'
      - '.github/workflows/shop-fitment-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fitment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DTH-3D-Commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DTH-3D-Commerce/package-lock.json
      - run: npm ci
      - run: npm run check && npm test && node --test tests/shop-motion.test.mjs tests/shop-discovery.test.mjs tests/shop-fitment.test.mjs
      - run: npm run build:flow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Start compiled Flow without an API or database
        run: |
          npm run preview --workspace frontend -- --host 127.0.0.1 --port 4173 > /tmp/dth-fitment-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/shop > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dth-fitment-preview.log
          exit 1
      - run: python tests/browser/shop_fitment.py --url http://127.0.0.1:4173
      - run: python tests/browser/shop_discovery.py --url http://127.0.0.1:4173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-fitment-checks
          path: DTH-3D-Commerce/test-results/shop-*/**
          if-no-files-found: warn
          retention-days: 7
