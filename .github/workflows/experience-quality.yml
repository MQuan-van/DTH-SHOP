name: Experience Studio regression
on:
  pull_request:
    paths: ['DTH-3D-Commerce/**', '.github/workflows/experience-quality.yml']
  push:
    branches: [feat/experience-studio]
    paths: ['DTH-3D-Commerce/**', '.github/workflows/experience-quality.yml']
permissions:
  contents: read
jobs:
  experience:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DTH-3D-Commerce
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked dependencies and unit regression
        run: |
          npm ci
          npm run check
          npm test
          npm run test:account
          npm run test:admin
          npm run test:experience
          node --test tests/home-stage.test.mjs tests/shop-motion.test.mjs
      - name: Isolated MongoDB for tests only
        run: |
          docker run -d --name dth-experience-ci -p 127.0.0.1:27017:27017 mongo:8.0 --quiet
          for i in $(seq 1 30); do if docker exec dth-experience-ci mongosh --quiet --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 1)' >/dev/null 2>&1; then exit 0; fi; sleep 1; done
          exit 1
      - name: Real database authorization, publication, rollback and regression
        run: |
          TEST_MONGO_URI=mongodb://127.0.0.1:27017/dth_experience_test node --test tests/experience.integration.test.mjs
          TEST_MONGO_URI=mongodb://127.0.0.1:27017/dth_account_test node --test tests/account.integration.test.mjs
          TEST_MONGO_URI=mongodb://127.0.0.1:27017/dth_support_test node --test tests/support.integration.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chromium
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/tmp/experience-browser-install.log 2>&1 || { tail -60 /tmp/experience-browser-install.log; exit 1; }
      - name: Build Flow and verify standalone Cinematic Home
        env:
          VITE_EXPERIENCE_TESTS: 'true'
        run: |
          npm run build:flow
          npm run preview --workspace frontend -- --host 127.0.0.1 >/tmp/experience-flow.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          python tests/browser/cinematic_home.py
      - name: Build and start the actual API application
        env:
          VITE_STORE_MODE: api
          VITE_EXPERIENCE_TESTS: 'true'
          MONGO_URI: mongodb://127.0.0.1:27017/dth_experience_browser_test
        run: |
          npm run build
          npm run seed
          npm start >/tmp/experience-api.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:5000/api/shop/health; then exit 0; fi; sleep 1; done
          cat /tmp/experience-api.log; exit 1
      - name: Actual camera ownership and admin publication in Chromium
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/dth_experience_browser_test
        run: |
          mkdir -p test-results/experience
          set -o pipefail
          python tests/browser/experience_studio.py 2>&1 | tee test-results/experience/browser.log
      - name: Record source and evidence
        if: always()
        run: |
          mkdir -p test-results/experience
          git rev-parse HEAD > test-results/experience/source-commit.txt
          npm audit --json > test-results/experience/dependency-audit.json || true
          test ! -f /tmp/experience-api.log || cp /tmp/experience-api.log test-results/experience/server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-studio-browser-evidence
          path: |
            DTH-3D-Commerce/test-results/experience/**
            DTH-3D-Commerce/test-results/cinematic/**
          retention-days: 7
      - name: Dispose only the CI database
        if: always()
        run: docker rm -f dth-experience-ci || true
