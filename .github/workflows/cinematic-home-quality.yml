name: Cinematic Home quality
on:
  push:
    branches: [feat/cinematic-home]
  pull_request:
    paths: ['DTH-3D-Commerce/frontend/src/experience/**', 'DTH-3D-Commerce/frontend/src/shop/home/**', 'DTH-3D-Commerce/tests/cinematic.test.mjs', 'DTH-3D-Commerce/tests/browser/cinematic_home.py', '.github/workflows/cinematic-home-quality.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked install and non-database regressions
        working-directory: DTH-3D-Commerce
        run: |
          npm ci
          npm run check
          npm test
          npm run test:account
          npm run test:admin
          npm run test:cinematic
          node --test tests/home-stage.test.mjs tests/shop-motion.test.mjs
      - name: Build API application without touching a database
        working-directory: DTH-3D-Commerce
        env:
          VITE_STORE_MODE: api
        run: npm run build
      - name: Build Flow for database-free browser review
        working-directory: DTH-3D-Commerce
        run: npm run build:flow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chromium
        run: python -m pip install -q playwright==1.55.0 && python -m playwright install --with-deps chromium
      - name: Start compiled frontend
        working-directory: DTH-3D-Commerce
        run: |
          npm run preview > /tmp/cinematic-vite.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/cinematic-vite.log; exit 1
      - name: Real scroll, scene framing, inspection and fallback review
        working-directory: DTH-3D-Commerce
        run: python tests/browser/cinematic_home.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-browser-evidence
          path: DTH-3D-Commerce/test-results/cinematic/**
          retention-days: 7
