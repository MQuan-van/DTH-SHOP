name: Cinematic Home quality
on:
  push:
    branches: [feat/cinematic-home]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record only the pinned GSAP manifest and lockfile on this feature branch
        working-directory: DTH-3D-Commerce
        run: |
          npm ci
          npm install --workspace frontend --save-exact gsap@3.15.0
          git add frontend/package.json package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: pin GSAP 3.15.0 for the Home motion director'
            git push origin HEAD:refs/heads/feat/cinematic-home
          fi
      - name: Build Flow without database
        working-directory: DTH-3D-Commerce
        run: npm run check && npm run build:flow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chromium
        run: python -m pip install -q playwright==1.55.0 && python -m playwright install --with-deps chromium
      - name: Start compiled frontend
        working-directory: DTH-3D-Commerce
        run: |
          npm run preview > /tmp/cinematic-vite.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/cinematic-vite.log; exit 1
      - name: Capture actual 3D story and interactions
        working-directory: DTH-3D-Commerce
        run: python tests/browser/cinematic_home.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-browser-evidence
          path: DTH-3D-Commerce/test-results/cinematic/**
          retention-days: 7
