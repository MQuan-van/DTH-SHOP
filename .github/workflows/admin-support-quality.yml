name: Admin Support quality
on:
  push:
    branches: [feat/admin-support-studio]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve decoder and prepare isolated workspace
        run: |
          mkdir -p /tmp/dth-review
          git archive HEAD DTH-3D-Commerce .github/workflows | tar -x -C /tmp/dth-review
          cd /tmp/dth-review/DTH-3D-Commerce
          npm ci
          npm install --workspace backend --save-exact sharp
          node -p 'JSON.parse(require("node:fs").readFileSync("node_modules/sharp/package.json")).version'
          npm audit --json > /tmp/admin-dependency-audit.json || true
          tar -czf /tmp/admin-review.tar.gz -C /tmp/dth-review .
      - uses: actions/upload-artifact@v4
        with:
          name: admin-review
          path: |
            /tmp/admin-review.tar.gz
            /tmp/admin-dependency-audit.json
          retention-days: 1
