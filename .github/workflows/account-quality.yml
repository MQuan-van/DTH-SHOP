name: Account Studio quality
on:
  push:
    branches: [feat/account-studio]
  pull_request:
    paths:
      - 'DTH-3D-Commerce/**'
      - '.github/workflows/account-quality.yml'
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 8
    defaults:
      run:
        working-directory: DTH-3D-Commerce
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DTH-3D-Commerce/package-lock.json
      - name: Install locked application dependencies
        run: npm ci
      - name: Check imports and domain tests
        run: |
          npm run check
          npm test
          node --test tests/account.test.mjs
      - name: Real API and MongoDB integration
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/dth_account_test
        run: node --test tests/account.integration.test.mjs
      - name: Compile actual React application
        env:
          VITE_STORE_MODE: api
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runner only
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Start isolated browser-test application
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/dth_account_browser_test
        run: |
          npm run seed
          npm start > /tmp/dth-account-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/shop/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/dth-account-server.log
          exit 1
      - name: Browser flows, screenshots and reduced motion
        run: python tests/browser/account.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-studio-evidence
          path: |
            DTH-3D-Commerce/test-results/account/**
          if-no-files-found: ignore
